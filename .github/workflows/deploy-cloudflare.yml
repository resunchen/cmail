name: Deploy cmail to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'mail-worker/**'
      - 'mail-vue/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmail-cloudflare-production
  cancel-in-progress: false

jobs:
  Deploy-cloud-mail:
    runs-on: ubuntu-latest
    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN || vars.ADMIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ secrets.PROJECT_LINK || vars.PROJECT_LINK }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
      CF_EMAIL: ${{ secrets.CF_EMAIL || vars.CF_EMAIL || false }}
      ANALYSIS_CACHE: ${{ secrets.ANALYSIS_CACHE || vars.ANALYSIS_CACHE || false }}
      LINUXDO_CLIENT_ID: ${{ secrets.LINUXDO_CLIENT_ID || vars.LINUXDO_CLIENT_ID }}
      LINUXDO_CALLBACK_URL: ${{ secrets.LINUXDO_CALLBACK_URL || vars.LINUXDO_CALLBACK_URL }}
      LINUXDO_SWITCH: ${{ secrets.LINUXDO_SWITCH || vars.LINUXDO_SWITCH }}


    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml

      - name: Validate release credentials
        working-directory: mail-worker
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_MIGRATION_API_TOKEN: ${{ secrets.D1_MIGRATION_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$D1_MIGRATION_API_TOKEN"
          node scripts/deploy.mjs --validate

      - name: Install dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Security gates and regression tests
        working-directory: mail-worker
        run: |
          pnpm security:check
          pnpm test

      - name: Build frontend before exposing credentials
        run: |
          pnpm --dir mail-vue install --frozen-lockfile
          pnpm --dir mail-vue run build

      - name: Provision D1 and KV resources
        working-directory: mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/provision.mjs

      - name: Prepare non-secret deployment configuration
        working-directory: mail-worker
        run: |
          python3 scripts/prepare_config.py
          python3 scripts/security_gate.py --config wrangler-deploy.json

      - name: Migrate D1 and refresh settings cache
        working-directory: mail-worker
        env:
          D1_MIGRATION_API_TOKEN: ${{ secrets.D1_MIGRATION_API_TOKEN }}
        run: pnpm db:migrate

      - name: Publish Worker with secret bindings
        working-directory: mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET }}
        run: node scripts/deploy.mjs

      - name: Clean temporary credential payloads
        if: always()
        run: rm -rf -- "$RUNNER_TEMP"/cmail-release-*
